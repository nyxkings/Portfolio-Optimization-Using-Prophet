[tool.poetry]
name = "forecast-driven-portfolio-optimization"
version = "0.1.0"
description = "\"Portfolio optimization using Prophet forecasts\""
authors = ["Chinda Ada <chindaada63@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
yfinance = "^1.3.0"
prophet = "^1.3.0"
pandas = "^3.0.2"
numpy = "^2.0.0"
